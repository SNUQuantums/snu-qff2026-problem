[project]
name = "tprep"
version = "3.0.3"
description = "Judge for the Qiskit Fall Fest 2026 @ SNU magic state preparation problem"
requires-python = ">=3.10"
dependencies = ["qiskit==2.5.2", "stim==1.16.0"]  # xtim==3.1.3+qff2 comes from this repo's release; see problem.md section 5


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tprep"]
